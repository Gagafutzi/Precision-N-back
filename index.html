<html lang="en" data-theme="cyan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Precision N-Back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root, :root[data-theme='cyan'] {
        --color-primary: #22d3ee;
        --color-secondary: #0891b2;
        --color-secondary-hover: #0e7490;
        --color-bg-base: #1f2937;
        --color-bg-surface: #374151;
        --color-text-base: #f3f4f6;
        --color-text-muted: #9ca3af;
        --color-accent-success: #22c55e;
        --color-accent-error: #ef4444;
        --color-accent-error-bg: #b91c1c;
        --color-accent-warning: #f59e0b;
        --color-button-spatial: #2563eb;
        --color-button-spatial-hover: #1d4ed8;
        --color-button-audio: #7c3aed;
        --color-button-audio-hover: #6d28d9;
        --color-button-color: #16a34a;
        --color-button-color-hover: #15803d;
        --color-button-shape: #d97706;
        --color-button-shape-hover: #b45309;
      }
      :root[data-theme='bw'] {
        --color-primary: #ffffff;
        --color-secondary: #e5e7eb;
        --color-secondary-hover: #d1d5db;
        --color-bg-base: #111827;
        --color-bg-surface: #1f2937;
        --color-text-base: #f9fafb;
        --color-text-muted: #d1d5db;
        --color-accent-success: #f9fafb;
        --color-accent-error: #f9fafb;
        --color-accent-error-bg: #991b1b;
        --color-accent-warning: #facc15;
        --color-button-spatial: #4b5563;
        --color-button-spatial-hover: #374151;
        --color-button-audio: #4b5563;
        --color-button-audio-hover: #374151;
        --color-button-color: #4b5563;
        --color-button-color-hover: #374151;
        --color-button-shape: #4b5563;
        --color-button-shape-hover: #374151;
      }
      :root[data-theme='green'] {
        --color-primary: #34d399;
        --color-secondary: #059669;
        --color-secondary-hover: #047857;
        --color-bg-base: #111827;
        --color-bg-surface: #1f2937;
        --color-text-base: #ecfdf5;
        --color-text-muted: #a1a1aa;
        --color-accent-success: #34d399;
        --color-accent-error: #f43f5e;
        --color-accent-error-bg: #be123c;
        --color-accent-warning: #f59e0b;
        --color-button-spatial: #166534;
        --color-button-spatial-hover: #15803d;
        --color-button-audio: #166534;
        --color-button-audio-hover: #15803d;
        --color-button-color: #166534;
        --color-button-color-hover: #15803d;
        --color-button-shape: #166534;
        --color-button-shape-hover: #15803d;
      }
      .bg-primary { background-color: var(--color-primary); }
      .bg-secondary { background-color: var(--color-secondary); }
      .hover\:bg-secondary-hover:hover { background-color: var(--color-secondary-hover); }
      .text-primary { color: var(--color-primary); }
      .border-accent-success { border-color: var(--color-accent-success); }
      .border-accent-error { border-color: var(--color-accent-error); }
      .text-accent-success { color: var(--color-accent-success); }
      .text-accent-error { color: var(--color-accent-error); }
      .bg-accent-success { background-color: var(--color-accent-success); }
      .bg-accent-error-heavy { background-color: var(--color-accent-error-bg); }
      .bg-accent-warning { background-color: var(--color-accent-warning); }
      .bg-button-spatial { background-color: var(--color-button-spatial); }
      .hover\:bg-button-spatial-hover:hover { background-color: var(--color-button-spatial-hover); }
      .bg-button-audio { background-color: var(--color-button-audio); }
      .hover\:bg-button-audio-hover:hover { background-color: var(--color-button-audio-hover); }
      .bg-button-color { background-color: var(--color-button-color); }
      .hover\:bg-button-color-hover:hover { background-color: var(--color-button-color-hover); }
      .bg-button-shape { background-color: var(--color-button-shape); }
      .hover\:bg-button-shape-hover:hover { background-color: var(--color-button-shape-hover); }


      /* --- Phone fundamentals ---------------------------------------------
         A phone's viewport is not the window: the browser's own chrome slides
         in and out, so 100vh is taller than what you can actually see and the
         bottom of a 100vh page sits under the address bar. 100dvh is the part
         that is on screen, with the vh line left in front of it for anything
         that does not know the unit yet. */
      .app-shell { min-height: 100vh; min-height: 100dvh; }
      .game-shell { height: 100vh; height: 100dvh; }

      /* The notch and the home bar, only where they exist. */
      .safe-area {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-x {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      html, body { height: 100%; }
      body {
        /* A swipe on the board should not drag the page or pull it down to
           reload mid-session. */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      /* A tap on a response button is an answer, timed to the trial: no
           300 ms wait for a possible double-tap zoom, no grey flash, and no
           text selection when the thumb lands slightly askew. */
      button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      input[type='range'] {
        accent-color: var(--color-primary);
        height: 1.75rem;
        touch-action: pan-y;
      }
      input[type='checkbox'] { accent-color: var(--color-primary); }
      /* Under 16px iOS zooms the whole page in when a field takes focus. */
      input, select, textarea { font-size: 16px; }

      /*
       * Controls at a size a thumb can actually hit.
       *
       * A finger pad is about 9 mm across and lands with roughly a 44px radius
       * of uncertainty, which is the figure both phone platforms publish as the
       * smallest reliable target. A mouse has no such trouble, so this applies
       * only where the pointer is coarse: a desktop keeps its compact controls.
       */
      /* A checkbox is about a quarter the width of a fingertip. The row it sits
         in is the real target, so the row carries the padding and the pointer,
         and a tap anywhere along it toggles the box. */
      .toggle-row {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        min-height: 44px;
      }

      @media (pointer: coarse) {
        button, select, input[type='number'], input[type='text'] { min-height: 44px; }
        /* Stop a number field shrinking to its content once it has a minimum. */
        input[type='number'] { padding-top: 0; padding-bottom: 0; }
        input[type='checkbox'] { width: 1.75rem; height: 1.75rem; }
        /* The thumb stays the size the platform draws it, but a press
           anywhere in the control's box moves it, so a taller box is a taller
           target — and the one that matters, since a slider is dragged rather
           than aimed at. */
        input[type='range'] { height: 2.75rem; }
      }

      @keyframes pulse-once {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
        50% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
      }
      .animate-pulse-once {
        animation: pulse-once 1.5s ease-out;
      }
    </style>
