<!DOCTYPE html>
<html lang="en" data-theme="cyan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precision N-Back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      The hub's look, applied where this app actually takes its colours from.

      Everything here is Tailwind utilities — `bg-gray-900`, `text-cyan-400` and
      ninety more — so retuning the custom properties below would have reached a
      third of the page and left the rest grey and cyan. Remapping the two scales
      the app uses reaches all of it, and no component has to be touched.

      `gray` becomes the sage-tinted near-blacks the hub is built on and `cyan`
      becomes the sage accent. Every other scale is untouched: green, red and
      amber are right, wrong and warning here, and they mean things.

      Radii go square, except `rounded-full` — that one is a circle, and the
      circles are circles on purpose.
    -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['ui-monospace', '"JetBrains Mono"', '"IBM Plex Mono"', '"SF Mono"',
                     'SFMono-Regular', 'Menlo', 'Consolas', '"DejaVu Sans Mono"', 'monospace'],
            },
            colors: {
              gray: {
                50:'#eef5f0', 100:'#dcebe2', 200:'#bdd6c7', 300:'#9dbfab',
                400:'#7e9a8a', 500:'#5b7264', 600:'#3f5348', 700:'#243329',
                800:'#131d18', 900:'#0f1713', 950:'#080d0b',
              },
              cyan: {
                50:'#eef5f0', 100:'#dcebe2', 200:'#c3ddce', 300:'#b7d8c5',
                400:'#8fbda4', 500:'#74a389', 600:'#5b866e', 700:'#456954',
                800:'#2f4b3b', 900:'#1c2f25', 950:'#0f1a14',
              },
            },
            borderRadius: { none:'0', sm:'0', DEFAULT:'0', md:'0', lg:'0', xl:'0', '2xl':'0', '3xl':'0' },
          },
        },
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      /* 'cyan' is the stored id of the default theme and existing settings carry
         it, so the values move rather than the name — renaming it would need the
         literal type in types.ts and every saved setting to move with it. */
      :root, :root[data-theme='cyan'] {
        --color-primary: #8fbda4;
        --color-secondary: #5b866e;
        --color-secondary-hover: #456954;
        --color-bg-base: #0f1713;
        --color-bg-surface: #243329;
        --color-text-base: #c9e0d3;
        --color-text-muted: #7e9a8a;
        --color-accent-success: #22c55e;
        --color-accent-error: #ef4444;
        --color-accent-error-bg: #b91c1c;
        --color-accent-warning: #f59e0b;
        --color-button-spatial: #2563eb;
        --color-button-spatial-hover: #1d4ed8;
        --color-button-audio: #7c3aed;
        --color-button-audio-hover: #6d28d9;
        --color-button-color: #16a34a;
        --color-button-color-hover: #15803d;
        --color-button-shape: #d97706;
        --color-button-shape-hover: #b45309;
      }
      :root[data-theme='bw'] {
        --color-primary: #ffffff;
        --color-secondary: #e5e7eb;
        --color-secondary-hover: #d1d5db;
        --color-bg-base: #111827;
        --color-bg-surface: #1f2937;
        --color-text-base: #f9fafb;
        --color-text-muted: #d1d5db;
        --color-accent-success: #f9fafb;
        --color-accent-error: #f9fafb;
        --color-accent-error-bg: #991b1b;
        --color-accent-warning: #facc15;
        --color-button-spatial: #4b5563;
        --color-button-spatial-hover: #374151;
        --color-button-audio: #4b5563;
        --color-button-audio-hover: #374151;
        --color-button-color: #4b5563;
        --color-button-color-hover: #374151;
        --color-button-shape: #4b5563;
        --color-button-shape-hover: #374151;
      }
      :root[data-theme='green'] {
        --color-primary: #34d399;
        --color-secondary: #059669;
        --color-secondary-hover: #047857;
        --color-bg-base: #111827;
        --color-bg-surface: #1f2937;
        --color-text-base: #ecfdf5;
        --color-text-muted: #a1a1aa;
        --color-accent-success: #34d399;
        --color-accent-error: #f43f5e;
        --color-accent-error-bg: #be123c;
        --color-accent-warning: #f59e0b;
        --color-button-spatial: #166534;
        --color-button-spatial-hover: #15803d;
        --color-button-audio: #166534;
        --color-button-audio-hover: #15803d;
        --color-button-color: #166534;
        --color-button-color-hover: #15803d;
        --color-button-shape: #166534;
        --color-button-shape-hover: #15803d;
      }
      .bg-primary { background-color: var(--color-primary); }
      .bg-secondary { background-color: var(--color-secondary); }
      .hover\:bg-secondary-hover:hover { background-color: var(--color-secondary-hover); }
      .text-primary { color: var(--color-primary); }
      .border-accent-success { border-color: var(--color-accent-success); }
      .border-accent-error { border-color: var(--color-accent-error); }
      .text-accent-success { color: var(--color-accent-success); }
      .text-accent-error { color: var(--color-accent-error); }
      .bg-accent-success { background-color: var(--color-accent-success); }
      .bg-accent-error-heavy { background-color: var(--color-accent-error-bg); }
      .bg-accent-warning { background-color: var(--color-accent-warning); }
      .bg-button-spatial { background-color: var(--color-button-spatial); }
      .hover\:bg-button-spatial-hover:hover { background-color: var(--color-button-spatial-hover); }
      .bg-button-audio { background-color: var(--color-button-audio); }
      .hover\:bg-button-audio-hover:hover { background-color: var(--color-button-audio-hover); }
      .bg-button-color { background-color: var(--color-button-color); }
      .hover\:bg-button-color-hover:hover { background-color: var(--color-button-color-hover); }
      .bg-button-shape { background-color: var(--color-button-shape); }
      .hover\:bg-button-shape-hover:hover { background-color: var(--color-button-shape-hover); }

      @keyframes pulse-once {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
        50% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
      }
      .animate-pulse-once {
        animation: pulse-once 1.5s ease-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-gray-950 text-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
